name: Build Mitra Chat Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger directly from phone browser!

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify google-services.json
        run: |
          if [ -f "google-services.json" ] && [ ! -f "android/app/google-services.json" ]; then
            echo "Moving root google-services.json to android/app/google-services.json"
            cp google-services.json android/app/google-services.json
          fi
          if [ ! -f "android/app/google-services.json" ]; then
            echo "Creating fallback google-services.json from template to ensure build succeeds"
            cp android/app/google-services.json.template android/app/google-services.json
          fi

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Extract Keystore SHA-1 & SHA-256 for Firebase
        run: |
          cd android
          gradle signingReport || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mitra-chat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
